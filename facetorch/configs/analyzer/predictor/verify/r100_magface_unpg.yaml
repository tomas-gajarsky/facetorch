_target_: facetorch.analyzer.predictor.FacePredictor

downloader:
  _target_: facetorch.downloader.DownloaderHuggingFace
  file_id: 1H-aPtFd9C5D7y1vzoWsObKAxeIBE9QPd
  path_local: ${facetorch.model_dir:}/exported/predictor/verify/1/model.pt2 # str
  repo_id: tomas-gajarsky/facetorch-verify-magface  # HuggingFace repo ID
  filename: model.pt2  # Filename in the HuggingFace repo
  manifest_id: verify-magface
  revision: e7466b10dcdcfa2abaa2e4bc00cb7e8774d45017
  sha256: c219b43378a3a6020d193bf71def35fad8db04acf696c422f7daa7514c3fa5a3
  size_bytes: 261287852
  offline: ${offline}
  allow_legacy_models: ${allow_legacy_models}
  device: ${analyzer.device}

device:
  _target_: torch.device
  type: ${analyzer.device} # str

preprocessor:
  _target_: facetorch.analyzer.predictor.pre.PredictorPreProcessor
  transform:
    _target_: torchvision.transforms.Compose
    transforms:
      - _target_: torchvision.transforms.Resize
        size: [112, 112] # List[int]
        antialias: True # bool
      - _target_: torchvision.transforms.Normalize
        mean: [0.485, 0.456, 0.406] # List[float]
        std: [0.229, 0.224, 0.225] # List[float]
  device:
    _target_: torch.device
    type: ${analyzer.predictor.verify.device.type}
  optimize_transform: ${analyzer.optimize_transforms}
  reverse_colors: False # bool

postprocessor:
  _target_: facetorch.analyzer.predictor.post.PostEmbedder
  transform: None
  device:
    _target_: torch.device
    type: ${analyzer.predictor.verify.device.type}
  optimize_transform: ${analyzer.optimize_transforms}
  labels: ["abstract"] # List
