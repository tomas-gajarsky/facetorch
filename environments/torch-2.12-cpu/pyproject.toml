[project]
name = "facetorch-torch-2-12-cpu"
version = "1.0.0"
requires-python = ">=3.10,<3.13"
dependencies = [
    "codetiming>=1.2.0",
    "googleapis-common-protos>=1.56.3",
    "gdown>=3.11.0",
    "hydra-core>=1.3.2,<1.4",
    "numpy>=1.18.2",
    "omegaconf>=2.3.0,<2.4",
    "python-json-logger>=2.0.0",
    "torch==2.12.1",
    "requests>=2.20.0",
    "timm>=0.6.0",
    "torchvision==0.27.1",
    "huggingface-hub>=0.16.0",
]

[project.optional-dependencies]
test = [
    "black>=22.1.0",
    "build>=1.2.2",
    "flake8>=5.0.4",
    "packaging>=25.0",
    "pdoc3==0.11.6",
    "pip>=25.0",
    "pytest>=6.0.0",
    "pytest-cov>=2.10.0",
    "setuptools>=77.0.3",
    "snakeviz>=2.1.0",
    "twine>=3.2.0",
]
release = [
    "check-wheel-contents>=0.6.2",
    "ipykernel>=6.29.0",
    "nbclient>=0.10.0",
    "nbformat>=5.10.0",
    "pip-audit==2.10.1",
]

[tool.uv]
package = false
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
