name: distribution-install

on:
  push:
    branches: ["main", "release/v1.0.0"]
  pull_request:
    branches: ["main", "release/v1.0.0"]

permissions:
  contents: read

concurrency:
  group: distribution-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-distributions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.12"
      - name: Build and inspect wheel and source distribution
        run: |
          python -m pip install "uv==0.9.14"
          uv sync --frozen --extra dev --extra release
          docs_check_dir="$(mktemp -d "$RUNNER_TEMP/facetorch-docs.XXXXXX")"
          uv run --frozen --extra dev pdoc --html facetorch \
            --output-dir "$docs_check_dir" --force --template-dir pdoc/templates
          diff -ru "$docs_check_dir/facetorch" docs/facetorch
          uv run --frozen --extra dev python scripts/check_pdoc_search_index.py \
            "$docs_check_dir/index.js" docs/index.js
          cmp "$docs_check_dir/doc-search.html" docs/doc-search.html
          uv run --frozen --extra dev --extra release python -m build
          uv run --frozen --extra dev --extra release twine check dist/*
          uv run --frozen --extra dev --extra release check-wheel-contents dist/*.whl
      - name: Execute the full suite from the unpacked source distribution
        run: |
          archive_check_dir="$(mktemp -d "$RUNNER_TEMP/facetorch-sdist.XXXXXX")"
          trap 'rm -rf "$archive_check_dir"' EXIT
          tar -xzf dist/facetorch-*.tar.gz -C "$archive_check_dir"
          cd "$archive_check_dir"/facetorch-*
          unset PYTHONPATH UV_PROJECT_ENVIRONMENT VIRTUAL_ENV
          uv sync --frozen --extra dev --extra release --python 3.12.12
          uv run --frozen --no-sync python - <<'PY'
          from pathlib import Path
          import facetorch

          assert not Path(".git").exists()
          assert Path(facetorch.__file__).resolve().is_relative_to(Path.cwd())
          PY
          uv run --frozen --no-sync python -m pytest -q \
            --junitxml="$RUNNER_TEMP/sdist-tests.xml"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: source-distribution-tests
          path: ${{ runner.temp }}/sdist-tests.xml
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  install-wheel:
    needs: build-distributions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist
      - name: Install the exact branch wheel from a frozen runtime graph
        run: |
          python -m pip install "uv==0.9.14"
          python -m venv "$RUNNER_TEMP/wheel-venv"
          VIRTUAL_ENV="$RUNNER_TEMP/wheel-venv" uv sync \
            --active --frozen --no-dev --no-install-project
          uv pip install --python "$RUNNER_TEMP/wheel-venv/bin/python" --no-deps dist/*.whl
          uv pip check --python "$RUNNER_TEMP/wheel-venv/bin/python"
      - name: Smoke installed package and packaged config outside the checkout
        run: |
          mkdir "$RUNNER_TEMP/empty"
          cd "$RUNNER_TEMP/empty"
          FACETORCH_OFFLINE=1 "$RUNNER_TEMP/wheel-venv/bin/python" - <<'PY'
          from pathlib import Path
          import facetorch
          from facetorch.analyzer.core import FaceAnalyzer

          config = facetorch.load_config(offline=True)
          analyzer = FaceAnalyzer(config.analyzer)
          assert config.analyzer.device == "cpu"
          assert analyzer.detector_loaded is False
          assert "site-packages" in Path(facetorch.__file__).as_posix()
          PY
      - name: Smoke the lowest supported Hydra and OmegaConf versions
        if: matrix.python-version == '3.12'
        run: |
          uv pip install --python "$RUNNER_TEMP/wheel-venv/bin/python" --no-deps \
            "hydra-core==1.3.2" "omegaconf==2.3.0"
          uv pip check --python "$RUNNER_TEMP/wheel-venv/bin/python"
          mkdir "$RUNNER_TEMP/minimum-config-empty"
          cd "$RUNNER_TEMP/minimum-config-empty"
          FACETORCH_OFFLINE=1 "$RUNNER_TEMP/wheel-venv/bin/python" - <<'PY'
          import hydra
          import omegaconf
          import facetorch
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from hydra.core.global_hydra import GlobalHydra
          from facetorch.exceptions import ConfigurationError

          assert hydra.__version__ == "1.3.2"
          assert omegaconf.__version__ == "2.3.0"
          assert facetorch.load_config(offline=True).analyzer.device == "cpu"
          with TemporaryDirectory() as temporary:
              root = Path(temporary)
              (root / "host.yaml").write_text("marker: host\n")
              (root / "library.yaml").write_text("marker: external\n")
              with hydra.initialize_config_dir(config_dir=temporary, version_base="1.3"):
                  host = GlobalHydra.instance().hydra
                  assert facetorch.load_config(offline=True).analyzer.device == "cpu"
                  assert facetorch.load_config_from_path(root / "library.yaml").marker == "external"
                  try:
                      facetorch.load_config(overrides=["missing=invalid"])
                  except ConfigurationError:
                      pass
                  else:
                      raise AssertionError("Invalid override must fail")
                  assert GlobalHydra.instance().hydra is host
                  assert hydra.compose(config_name="host").marker == "host"
          PY
