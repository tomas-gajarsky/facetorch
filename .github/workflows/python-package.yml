name: distribution-install

on:
  push:
    branches: ["main", "release/v1.0.0"]
  pull_request:
    branches: ["main", "release/v1.0.0"]

permissions:
  contents: read

concurrency:
  group: distribution-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-distributions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.12"
      - name: Build and inspect wheel and source distribution
        run: |
          python -m pip install "uv==0.9.14"
          uv sync --frozen --extra dev --extra release
          docs_check_dir="$(mktemp -d "$RUNNER_TEMP/facetorch-docs.XXXXXX")"
          uv run --frozen --extra dev pdoc --html facetorch \
            --output-dir "$docs_check_dir" --force --template-dir pdoc/templates
          diff -ru "$docs_check_dir/facetorch" docs/facetorch
          uv run --frozen --extra dev python scripts/check_pdoc_search_index.py \
            "$docs_check_dir/index.js" docs/index.js
          cmp "$docs_check_dir/doc-search.html" docs/doc-search.html
          uv run --frozen --extra dev --extra release python -m build
          uv run --frozen --extra dev --extra release twine check dist/*
          uv run --frozen --extra dev --extra release check-wheel-contents dist/*.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  install-wheel:
    needs: build-distributions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist
      - name: Install the exact branch wheel from a frozen runtime graph
        run: |
          python -m pip install "uv==0.9.14"
          python -m venv "$RUNNER_TEMP/wheel-venv"
          VIRTUAL_ENV="$RUNNER_TEMP/wheel-venv" uv sync \
            --active --frozen --no-dev --no-install-project
          uv pip install --python "$RUNNER_TEMP/wheel-venv/bin/python" --no-deps dist/*.whl
          uv pip check --python "$RUNNER_TEMP/wheel-venv/bin/python"
      - name: Smoke installed package and packaged config outside the checkout
        run: |
          mkdir "$RUNNER_TEMP/empty"
          cd "$RUNNER_TEMP/empty"
          FACETORCH_OFFLINE=1 "$RUNNER_TEMP/wheel-venv/bin/python" - <<'PY'
          from pathlib import Path
          import facetorch
          from facetorch.analyzer.core import FaceAnalyzer

          config = facetorch.load_config(offline=True)
          analyzer = FaceAnalyzer(config.analyzer)
          assert config.analyzer.device == "cpu"
          assert analyzer.detector_loaded is False
          assert "site-packages" in Path(facetorch.__file__).as_posix()
          PY
