name: cpu-cohorts

on:
  push:
    branches: ["main", "release/v1.0.0"]
  pull_request:
    branches: ["main", "release/v1.0.0"]

permissions:
  contents: read

concurrency:
  group: cpu-cohorts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-cohort:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - torch-cohort: "2.6"
            profile: environments/torch-2.6-cpu
            python-version: "3.10"
          - torch-cohort: "2.7"
            profile: environments/torch-2.7-cpu
            python-version: "3.10"
          - torch-cohort: "2.8"
            profile: environments/torch-2.8-cpu
            python-version: "3.10"
          - torch-cohort: "2.9"
            profile: environments/torch-2.9-cpu
            python-version: "3.10"
          - torch-cohort: "2.10"
            profile: environments/torch-2.10-cpu
            python-version: "3.10"
          - torch-cohort: "2.11"
            profile: environments/torch-2.11-cpu
            python-version: "3.10"
          - torch-cohort: "2.12"
            profile: environments/torch-2.12-cpu
            python-version: "3.10"
          - torch-cohort: "2.13"
            profile: environments/torch-2.13-cpu
            python-version: "3.10"
          - torch-cohort: "2.6"
            profile: environments/torch-2.6-cpu
            python-version: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install exact Torch ${{ matrix.torch-cohort }} CPU profile
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          python -m pip install "uv==0.9.14"
          uv sync --project "$PROFILE" --frozen --extra test --python python
      - name: Run source tests with import identity guard
        env:
          PROFILE: ${{ matrix.profile }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          uv run --project "$PROFILE" --frozen --extra test --no-sync python - <<'PY'
          from pathlib import Path
          import facetorch

          assert Path(facetorch.__file__).resolve().is_relative_to(Path.cwd())
          PY
          uv run --project "$PROFILE" --frozen --extra test --no-sync python -m pytest -q
