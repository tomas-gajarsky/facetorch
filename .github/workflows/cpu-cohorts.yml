name: cpu-cohorts

on:
  push:
    branches: ["main", "release/v1.0.0"]
  pull_request:
    branches: ["main", "release/v1.0.0"]

permissions:
  contents: read

concurrency:
  group: cpu-cohorts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-cohort:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - torch-cohort: "2.6"
            profile: environments/torch-2.6-cpu
            python-version: "3.10"
          - torch-cohort: "2.11"
            profile: environments/torch-2.11-cpu
            python-version: "3.10"
          - torch-cohort: "2.6"
            profile: environments/torch-2.6-cpu
            python-version: "3.11"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install exact Torch ${{ matrix.torch-cohort }} CPU profile
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          python -m pip install "uv==0.9.14"
          uv sync --project "$PROFILE" --frozen --extra test --python python
      - name: Run source tests with import identity guard
        env:
          PROFILE: ${{ matrix.profile }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          uv run --project "$PROFILE" --frozen --extra test --no-sync python - <<'PY'
          from pathlib import Path
          import facetorch

          assert Path(facetorch.__file__).resolve().is_relative_to(Path.cwd())
          PY
          uv run --project "$PROFILE" --frozen --extra test --no-sync python -m pytest -q
