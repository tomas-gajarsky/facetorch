name: conda-env

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  conda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.10"
          environment-file: environment.yml
          channels: conda-forge
          conda-remove-defaults: true
          auto-activate-base: true
          activate-environment: base
          conda-solver: libmamba

      - name: Remove conflicting signature-verification plugin
        run: |
          conda remove conda-content-trust --yes --force 2>/dev/null || true

      - name: Install facetorch from conda-forge
        run: |
          conda install -c conda-forge --override-channels facetorch
