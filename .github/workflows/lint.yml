name: lint-and-locks

on:
  push:
    branches: ["main", "release/v1.0.0"]
  pull_request:
    branches: ["main", "release/v1.0.0"]

permissions:
  contents: read

concurrency:
  group: lint-and-locks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-locks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install locked development environment
        run: |
          python -m pip install "uv==0.9.14"
          uv sync --frozen --extra dev
      - name: Verify every dependency profile
        run: |
          uv lock --check
          for profile in environments/*; do
            uv lock --check --project "$profile"
          done
          uv run --frozen --extra dev python scripts/check_dependency_sync.py
      - name: Lint and compile
        run: |
          uv run --frozen --extra dev flake8 --config=.flake8
          uv run --frozen --extra dev python -m compileall -q facetorch model_defs scripts tests
          git diff --check
