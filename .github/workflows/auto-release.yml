name: release-candidate-dry-run

on:
  push:
    branches: ["main"]
    paths:
      - "pyproject.toml"
      - "CHANGELOG.md"
      - "facetorch/models/**"
      - ".github/workflows/auto-release.yml"
      - ".github/workflows/release.yml"

permissions:
  actions: read
  contents: read

concurrency:
  group: release-candidate-dry-run-${{ github.sha }}
  cancel-in-progress: false

jobs:
  resolve-dry-run-inputs:
    runs-on: ubuntu-24.04
    outputs:
      configured: ${{ steps.resolve.outputs.configured }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      tag: ${{ steps.resolve.outputs.tag }}
      model_manifest_repo: ${{ steps.resolve.outputs.model_manifest_repo }}
      model_manifest_revision: ${{ steps.resolve.outputs.model_manifest_revision }}
      model_manifest_filename: ${{ steps.resolve.outputs.model_manifest_filename }}
      model_manifest_sha256: ${{ steps.resolve.outputs.model_manifest_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: true
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.12"
      - name: Resolve immutable dry-run inputs
        id: resolve
        env:
          MODEL_FILENAME: ${{ vars.FACETORCH_MODEL_MANIFEST_FILENAME }}
          MODEL_REPO: ${{ vars.FACETORCH_MODEL_MANIFEST_REPO }}
          MODEL_REVISION: ${{ vars.FACETORCH_MODEL_MANIFEST_REVISION }}
          MODEL_SHA256: ${{ vars.FACETORCH_MODEL_MANIFEST_SHA256 }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import PurePosixPath
          import re
          import tomllib

          from scripts.release_transaction import tag_for_project_version

          version = tomllib.loads(open("pyproject.toml", "rb").read().decode())["project"]["version"]
          values = {
              "source_sha": os.environ["SOURCE_SHA"],
              "tag": tag_for_project_version(version),
              "model_manifest_repo": os.environ["MODEL_REPO"],
              "model_manifest_revision": os.environ["MODEL_REVISION"],
              "model_manifest_filename": os.environ["MODEL_FILENAME"],
              "model_manifest_sha256": os.environ["MODEL_SHA256"],
          }
          configured = all(values[name] for name in values if name.startswith("model_"))
          if configured:
              filename = values["model_manifest_filename"]
              path = PurePosixPath(filename)
              if (
                  re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_.-]*/[A-Za-z0-9][A-Za-z0-9_.-]*", values["model_manifest_repo"]) is None
                  or re.fullmatch(r"[0-9a-f]{40}", values["model_manifest_revision"]) is None
                  or re.fullmatch(r"[0-9a-f]{64}", values["model_manifest_sha256"]) is None
                  or len(filename) > 512
                  or path.is_absolute()
                  or not path.parts
                  or any(
                      re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]*", part) is None
                      for part in filename.split("/")
                  )
              ):
                  raise SystemExit("Configured model-manifest variables are invalid")
          else:
              for name in values:
                  if name.startswith("model_"):
                      values[name] = ""
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"configured={str(configured).lower()}\n")
              for name, value in values.items():
                  output.write(f"{name}={value}\n")
          PY
      - name: Explain an intentionally unconfigured automatic dry run
        if: steps.resolve.outputs.configured != 'true'
        run: |
          echo "Set the four FACETORCH_MODEL_MANIFEST_* repository variables after"
          echo "the immutable model manifest is approved; publication is never automatic."

  coordinated-dry-run:
    if: needs.resolve-dry-run-inputs.outputs.configured == 'true'
    needs: resolve-dry-run-inputs
    # Reusable workflows cannot request more than the caller's permission
    # envelope. Publication jobs in release.yml need these scopes when invoked
    # manually with dry_run=false; the automatic call remains dry-run-only, and
    # every write-capable nested job is conditionally excluded in that mode.
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      source_sha: ${{ needs.resolve-dry-run-inputs.outputs.source_sha }}
      tag: ${{ needs.resolve-dry-run-inputs.outputs.tag }}
      model_manifest_repo: ${{ needs.resolve-dry-run-inputs.outputs.model_manifest_repo }}
      model_manifest_revision: ${{ needs.resolve-dry-run-inputs.outputs.model_manifest_revision }}
      model_manifest_filename: ${{ needs.resolve-dry-run-inputs.outputs.model_manifest_filename }}
      model_manifest_sha256: ${{ needs.resolve-dry-run-inputs.outputs.model_manifest_sha256 }}
      dry_run: true
